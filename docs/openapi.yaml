  /api/ai-tutor/token-usage:
    get:
      summary: Get AI tutor token usage
      description: Returns the user's AI tutor token usage for the current usage window.
      tags:
        - AI Tutor
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token usage retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  availableTokens:
                    type: integer
                    description: Number of tokens remaining in the current usage window.
                    example: 8450
                  usedTokens:
                    type: integer
                    description: Number of tokens used in the current usage window.
                    example: 1550
                  totalTokens:
                    type: integer
                    description: Maximum number of tokens allowed in the current usage window.
                    example: 10000
                  oldestMessage:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp of the oldest message counted towards the current usage window.
                    example: "2026-08-02T08:15:42.123Z"
        "401":
          description: Invalid or missing authentication token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid auth token
        "500":
          description: Failed to load token usage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to load token usage
    options:
      summary: CORS preflight
      description: Responds to CORS preflight requests for this endpoint.
      tags:
        - AI Tutor
      responses:
        "204":
          description: No content.
  /api/ai-tutor/chat/stream:
    post:
      tags:
        - AI Tutor
      summary: Stream an AI Tutor chat response from Gemini
      operationId: streamAiTutorChatResponse
      description: >
        Streams incremental AI response chunks from
        /api/ai-tutor/chat/stream using Server-Sent Events. In local
        development, the route may also accept Authorization: dev when
        the dev-only bypass is enabled in code. The AI Tutor's system
        instruction is managed by the application.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              properties:
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum:
                          - system
                          - user
                          - assistant
                      content:
                        type: string
                page_context:
                  type: object
                  description: >
                    Optional, transient context describing the page reported for
                    this request. Unsupported but well-formed paths are ignored
                    and chat continues normally. The server derives the page
                    label from verified navigation knowledge; client-supplied
                    titles or instructions are not part of this contract. This
                    context does not establish access rights or provide the
                    page's actual content.
                  required:
                    - path
                  properties:
                    path:
                      type: string
                      maxLength: 200
                      description: >
                        A local pathname beginning with a single slash. Full URLs,
                        protocol-relative URLs, query strings, fragments, control
                        characters, encoded paths, and traversal-like paths are
                        invalid. Recognised dynamic DAO paths are normalised to
                        their canonical template.
                      example: /dao/{DAOID}
                config:
                  type: object
                  additionalProperties: true
                  properties:
                    temperature:
                      type: number
                      format: float
                    maxOutputTokens:
                      type: integer
                    topP:
                      type: number
                      format: float
                    stopSequences:
                      type: array
                      items:
                        type: string
            example:
              messages:
                - role: user
                  content: Explain what a DAO is in three concise bullet points.
              page_context:
                path: /dao/{DAOID}
              config:
                temperature: 0.7
                maxOutputTokens: 512
                topP: 0.9
                stopSequences: []
      responses:
        "200":
          description: Server-Sent Events stream of AI response chunks
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Streamed SSE frames. Each response chunk is sent as data:
                  <text>, and the stream ends with data: [DONE].
              example: |
                data: A DAO is a decentralized autonomous organization.

                data: [DONE]

        "400":
          description: >
            Invalid request body, such as a missing or empty messages array or
            malformed page_context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Messages array is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: LLM provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: LLM provider error

  /api/ai-tutor/conversations:
    get:
      tags:
        - AI Tutor
      summary: List (or search) the authenticated user's AI Tutor conversations
      operationId: listAiTutorConversations
      description: >
        Returns active (non-ended) conversations owned by the authenticated
        user, ordered by updated_at descending and then id descending. When q
        is provided, results are filtered to conversations whose title
        case-insensitively contains q; an empty or whitespace-only q is treated
        the same as omitting it. Pagination uses a zero-based row offset and
        probes one extra row to report whether another page exists.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: >
            Optional case-insensitive partial match on conversation title.
            Empty, whitespace-only, or omitted returns the normal
            unfiltered list.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based number of matching conversation rows to skip.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
          description: >
            Maximum conversations returned. Values above 100 are capped at
            100. Supplied values must contain only base-10 decimal digits and
            be safe integers.
      responses:
        "200":
          description: Conversations for the authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                  - conversation
                  - hasMore
                  - nextOffset
                properties:
                  conversation:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
                  hasMore:
                    type: boolean
                    description: Whether another page exists after this page.
                  nextOffset:
                    type: integer
                    minimum: 0
                    description: >
                      Offset for the next page, calculated from the requested
                      offset plus the number of conversations returned.
              example:
                conversation: []
                hasMore: false
                nextOffset: 0
        "400":
          description: >
            Invalid pagination value. Empty, malformed, decimal, negative,
            hexadecimal, exponential, and unsafe-integer values are rejected;
            limit must also be greater than zero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: limit must be a positive base-10 integer and offset must be a non-negative base-10 integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - AI Tutor
      summary: Create a new AI Tutor conversation
      operationId: createAiTutorConversation
      description: >
        Creates a new active conversation for the authenticated user. The
        title is set later once generated.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DaoGroupId:
      name: daoGroupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: DAO forum group UUID.
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: DAO forum post UUID.
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: DAO forum comment UUID.

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized or invalid auth token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: string

    SuccessMessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    AllowedResponse:
      type: object
      properties:
        allowed:
          type: boolean
        message:
          type: string

    CheckUserRequest:
      type: object
      required:
        - email
        - course
      properties:
        email:
          type: string
          format: email
        course:
          type: string

    RegisterRequest:
      type: object
      required:
        - uuid
        - course
      properties:
        uuid:
          type: string
          format: uuid
        course:
          type: string

    UserSessionResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        registered:
          type: boolean
        email:
          type: string
          format: email
        UID:
          type: string
          format: uuid
        walletData:
          type: array
          items:
            $ref: "#/components/schemas/Wallet"

    Wallet:
      type: object
      properties:
        walletAddress:
          type: string
        publicAddress:
          type: string
        ENS:
          type: string

    Dao:
      type: object
      additionalProperties: true
      properties:
        DAOID:
          type: string
        Name:
          type: string
        DAOTreasury:
          type: string
        Members:
          type: object
          additionalProperties: true
        Proposals:
          type: array
          items:
            type: object
            additionalProperties: true

    PostListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dao_group_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
          nullable: true
          description: Null for anonymous posts.
        post_type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        anonymous:
          type: boolean
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        comment_count:
          type: integer
        author:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
              nullable: true
            FirstName:
              type: string
              nullable: true
            LastName:
              type: string
              nullable: true
            Name:
              type: string
              nullable: true
            walletAddress:
              type: string
              nullable: true
            ensName:
              type: string
              nullable: true
        tags:
          type: array
          items:
            type: string
        is_own_post:
          type: boolean
          description: Present for anonymous posts; indicates viewer ownership without identifying the author.
        can_delete:
          type: boolean
          description: True for the author or a shaman of this DAO.
        view_count:
          type: integer
          minimum: 0
        is_unread:
          type: boolean
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dao_group_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
          nullable: true
          description: Null for anonymous posts.
        post_type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        anonymous:
          type: boolean
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        is_own_post:
          type: boolean
          description: Present for anonymous posts; indicates viewer ownership without identifying the author.
    CreatePostRequest:
      type: object
      required:
        - post_type
        - title
        - body
        - anonymous
      properties:
        post_type:
          type: string
          enum:
            - Announcement
            - Proposal
            - Question
            - Discussion
            - Resource
        title:
          type: string
          maxLength: 50
        body:
          type: string
          description: Formatted content, limited to 350 visible text characters.
        anonymous:
          type: boolean
        image_url:
          type: string
          nullable: true
        poll:
          $ref: "#/components/schemas/CreateForumPoll"
    UpdatePostRequest:
      allOf:
        - $ref: "#/components/schemas/CreatePostRequest"
      description: Same post fields as creation; poll is ignored and cannot modify an existing poll. updated_at is database-managed.
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        parent_comment_id:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
    CommentListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        author_id:
          type: string
          format: uuid
        username:
          type: string
        parent_comment_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        wallet_address:
          type: string
          nullable: true
        ens_name:
          type: string
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        is_context_only:
          type: boolean
        reaction_counts:
          $ref: "#/components/schemas/ReactionCounts"
        user_reactions:
          $ref: "#/components/schemas/UserReactions"
    CreateCommentRequest:
      type: object
      description: At least one of body or image_url must be provided.
      properties:
        body:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        parent_comment_id:
          type: string
          format: uuid
          nullable: true
    CreateCommentResponse:
      type: object
      properties:
        comment:
          $ref: "#/components/schemas/CommentListItem"
    UpdateCommentRequest:
      type: object
      description: At least one of body or image_url must be provided.
      properties:
        body:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
    UpdateCommentResponse:
      type: object
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
    DeleteCommentResponse:
      type: object
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
    CommentReaction:
      type: object
      properties:
        comment_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        reaction:
          $ref: "#/components/schemas/ReactionType"
    ReactionType:
      type: string
      enum:
        - heart
        - thumbs_up
        - fire
        - thumbs_down
    ReactionCounts:
      type: object
      properties:
        heart:
          type: integer
          minimum: 0
        thumbs_up:
          type: integer
          minimum: 0
        fire:
          type: integer
          minimum: 0
        thumbs_down:
          type: integer
          minimum: 0
    UserReactions:
      type: object
      properties:
        heart:
          type: boolean
        thumbs_up:
          type: boolean
        fire:
          type: boolean
        thumbs_down:
          type: boolean
    CreateForumPoll:
      type: object
      required:
        - question
        - options
        - allow_multiple
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 200
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 80
        allow_multiple:
          type: boolean
    ForumPoll:
      type: object
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
        allowMultiple:
          type: boolean
        totalVoters:
          type: integer
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              label:
                type: string
              voteCount:
                type: integer
              isSelected:
                type: boolean
    ForumPollResponse:
      type: object
      properties:
        poll:
          allOf:
            - $ref: "#/components/schemas/ForumPoll"
          nullable: true

    SummonDaoRequest:
      type: object
      required:
        - daoName
        - votingTokenName
        - votingTokenSymbol
        - members
        - selectedWallet
      properties:
        daoName:
          type: string
        votingTokenName:
          type: string
        votingTokenSymbol:
          type: string
        votingPeriod:
          type: integer
        gracePeriod:
          type: integer
        quorum:
          type: number
        minRetention:
          type: number
        sponsorThreshold:
          type: number
        newOffering:
          type: number
        selectedWallet:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/DaoMember"
        shamans:
          type: array
          items:
            $ref: "#/components/schemas/DaoShaman"

    DaoMember:
      type: object
      properties:
        address:
          type: string
        shares:
          oneOf:
            - type: string
            - type: number
        loot:
          oneOf:
            - type: string
            - type: number

    DaoShaman:
      type: object
      properties:
        address:
          type: string
        permission:
          type: integer

    DaoInfoRequest:
      type: object
      required:
        - daoAddress
      properties:
        daoAddress:
          type: string

    DaoInfoResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tokenAddress:
          type: string
        nonVotingTokenAddress:
          type: string
        chain:
          type: string

    ProposalTxHashesRequest:
      type: object
      required:
        - daoAddress
        - proposalIds
      properties:
        daoAddress:
          type: string
        proposalIds:
          type: array
          minItems: 1
          items:
            type: integer

    ProposalTransactionHash:
      type: object
      properties:
        proposalId:
          type: integer
        transactionHash:
          type: string
          nullable: true

    MemberVotedRequest:
      type: object
      required:
        - id
        - walletAddress
        - daoAddress
      properties:
        id:
          type: integer
        walletAddress:
          type: string
        daoAddress:
          type: string

    ModuleRequest:
      type: object
      required:
        - Title
        - Description
        - Category
      properties:
        Title:
          type: string
        Description:
          type: string
        Category:
          type: string
          enum:
            - dao
            - defi
            - basics
        OrderIndex:
          type: integer
          minimum: 0
        CourseID:
          type: string
          nullable: true

    ModuleUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ModuleRequest"
        - type: object
          required:
            - ModuleID
          properties:
            ModuleID:
              type: string
              format: uuid

    LearningModule:
      type: object
      additionalProperties: true
      properties:
        ModuleID:
          type: string
          format: uuid
        Title:
          type: string
        Description:
          type: string
        Category:
          type: string
        OrderIndex:
          type: integer
        CourseID:
          type: string
          nullable: true
        CreatedBy:
          type: string
          nullable: true
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time

    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
        title:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
