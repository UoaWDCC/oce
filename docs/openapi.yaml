openapi: 3.0.3
info:
  title: OCE Application API
  version: 0.1.0
  description: >
    OpenAPI specification for the API routes currently present under
    src/app/api in this repository.
servers:
  - url: http://localhost:3000
    description: Local Next.js development server
tags:
  - name: Auth
  - name: DAO
  - name: DAO Forum
  - name: Learning
  - name: AI Tutor
  - name: Blockchain
paths:
  /api/check-user:
    options:
      tags:
        - Auth
      summary: CORS preflight for check-user
      operationId: optionsCheckUser
      responses:
        "204":
          description: CORS preflight accepted
    post:
      tags:
        - Auth
      summary: Check whether an email is allowed to register for a course
      operationId: checkUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckUserRequest"
            example:
              email: student@example.com
              course: INFO101
      responses:
        "200":
          description: Registration allowance result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/register:
    options:
      tags:
        - Auth
      summary: CORS preflight for register
      operationId: optionsRegister
      responses:
        "200":
          description: CORS preflight accepted
    get:
      tags:
        - Auth
      summary: Health check for the register API
      operationId: getRegisterHealth
      responses:
        "200":
          description: Register API health message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      tags:
        - Auth
      summary: Complete user registration profile setup
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              uuid: 11111111-1111-1111-1111-111111111111
              course: INFO101
      responses:
        "200":
          description: Registration completed or user already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/user/session:
    get:
      tags:
        - Auth
      summary: Get current authenticated user session and wallet data
      operationId: getUserSession
      description: Uses the current Supabase cookie-backed session.
      responses:
        "200":
          description: Authenticated session data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/summon:
    options:
      tags:
        - DAO
      summary: CORS preflight for summon
      operationId: optionsSummon
      responses:
        "200":
          description: CORS preflight accepted
    post:
      tags:
        - DAO
      summary: Summon/create a DAO
      operationId: summonDao
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummonDaoRequest"
            example:
              daoName: Test DAO
              votingTokenName: Test Voting Token
              votingTokenSymbol: TVT
              votingPeriod: 600
              gracePeriod: 300
              quorum: 20
              minRetention: 66
              sponsorThreshold: 1
              newOffering: 0
              selectedWallet: "0x0000000000000000000000000000000000000000"
              members:
                - address: "0x0000000000000000000000000000000000000000"
                  shares: 1
                  loot: 0
              shamans: []
      responses:
        "200":
          description: DAO creation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/get-user-daos:
    get:
      tags:
        - DAO
      summary: Get DAOs for the authenticated user
      operationId: getUserDaos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Student and DAO list
          content:
            application/json:
              schema:
                type: object
                properties:
                  student:
                    type: object
                    additionalProperties: true
                  daos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Dao"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/get-dao-user:
    options:
      tags:
        - DAO
      summary: CORS preflight for get-dao-user
      operationId: optionsGetDaoUser
      responses:
        "200":
          description: CORS preflight accepted
    get:
      tags:
        - DAO
      summary: Get current user wallet context for a DAO
      operationId: getDaoUser
      security:
        - bearerAuth: []
      parameters:
        - name: DAOID
          in: query
          required: true
          schema:
            type: string
          description: DAO contract address or DAO identifier used by the app.
      responses:
        "200":
          description: DAO user context
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/get-class-daos:
    options:
      tags:
        - DAO
      summary: CORS preflight for get-class-daos
      operationId: optionsGetClassDaos
      responses:
        "200":
          description: CORS preflight accepted
    get:
      tags:
        - DAO
      summary: Get DAOs associated with the authenticated user's class
      operationId: getClassDaos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Class DAO list
          content:
            application/json:
              schema:
                type: object
                properties:
                  daos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Dao"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/get-addresses:
    options:
      tags:
        - DAO
      summary: CORS preflight for get-addresses
      operationId: optionsGetAddresses
      responses:
        "200":
          description: CORS preflight accepted
    get:
      tags:
        - DAO
      summary: Get class wallet addresses and DAO treasury addresses
      operationId: getAddresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/getDaoInfo:
    options:
      tags:
        - DAO
      summary: CORS preflight for getDaoInfo
      operationId: optionsGetDaoInfo
      responses:
        "200":
          description: CORS preflight accepted
    post:
      tags:
        - DAO
        - Blockchain
      summary: Read DAO token and name information from chain
      operationId: getDaoInfo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaoInfoRequest"
            example:
              daoAddress: "0x0000000000000000000000000000000000000000"
      responses:
        "200":
          description: DAO info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaoInfoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/get-proposal-tx-hashes:
    options:
      tags:
        - DAO
      summary: CORS preflight for get-proposal-tx-hashes
      operationId: optionsGetProposalTxHashes
      responses:
        "200":
          description: CORS preflight accepted
    post:
      tags:
        - DAO
      summary: Get transaction hashes for proposal IDs
      operationId: getProposalTxHashes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalTxHashesRequest"
            example:
              daoAddress: "0x0000000000000000000000000000000000000000"
              proposalIds:
                - 1
                - 2
      responses:
        "200":
          description: Proposal transaction hashes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  transactionHashes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProposalTransactionHash"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/dao-forum/{daoGroupId}/posts:
    get:
      tags:
        - DAO Forum
      summary: List posts for a DAO forum group
      operationId: listDaoForumPosts
      parameters:
        - $ref: "#/components/parameters/DaoGroupId"
      responses:
        "200":
          description: DAO forum posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security: &a1
        - bearerAuth: []
      description: Returns live posts with counts, unread state, anonymous-author redaction and can_delete capability. DAO read access is enforced by the configured database policies. Lists are not paginated.
    post:
      tags:
        - DAO Forum
      summary: Create a post in a DAO forum group
      operationId: createDaoForumPost
      description: Authenticates a Bearer token and checks DAO membership. Optional poll creation is atomic through create_forum_post_with_poll. Anonymous responses redact author_id. JSON must be an object; invalid field types return 400 and content/poll validation failures return 422.
      parameters:
        - $ref: "#/components/parameters/DaoGroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
            example:
              post_type: Announcement
              title: Test post
              body: Testing a DAO forum post
              anonymous: false
              image_url: null
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflict with existing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Content or poll validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security: *a1
  /api/dao-forum/{daoGroupId}/posts/{postId}:
    get:
      tags:
        - DAO Forum
      summary: Get one DAO forum post
      operationId: getDaoForumPost
      parameters:
        - $ref: "#/components/parameters/DaoGroupId"
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: DAO forum post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security: *a1
      description: Returns a non-deleted post subject to database read policies. Anonymous author_id is null; is_own_post preserves ownership without exposing identity.
    patch:
      tags:
        - DAO Forum
      summary: Update one DAO forum post
      operationId: updateDaoForumPost
      description: Authors may edit their own live posts. Shaman status does not grant editing rights. Existing polls cannot be edited through this route. Invalid JSON objects or field types return 400; content limit failures return 422.
      parameters:
        - $ref: "#/components/parameters/DaoGroupId"
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
            example:
              post_type: Announcement
              title: Updated post
              body: Updated post body
              anonymous: false
              image_url: null
              updated_at: 2026-05-24T00:00:00.000Z
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Content validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security: *a1
    delete:
      tags:
        - DAO Forum
      summary: Soft delete one DAO forum post
      operationId: deleteDaoForumPost
      description: |
        Uses a Bearer token to authenticate the current user. The route first verifies that the post exists in the DAO group and that the current user is the post author or a shaman of that DAO, then soft-deletes the post by setting deleted_at. Shaman status is resolved from the DAO's shaman addresses and the authenticated user's wallets. This includes anonymous posts and does not grant permission to edit another author's content. Comments are not individually soft-deleted by this route.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DaoGroupId"
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Soft-deleted post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/dao-forum/{daoGroupId}/posts/{postId}/comments:
    options:
      tags:
        - DAO Forum
      summary: CORS preflight for DAO forum comments
      operationId: optionsDaoForumComments
      responses:
        "200":
          description: CORS preflight accepted
    get:
      tags:
        - DAO Forum
      summary: List comments for a DAO forum post
      operationId: listDaoForumComments
      description: Authenticates a Bearer token and verifies DAO membership and a live parent post. Returns matching comments and all ancestors needed to retain nesting. Live non-matching ancestors have is_context_only=true. Deleted ancestors have null body/image_url. Sorting applies within each set of siblings.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DaoGroupId"
        - $ref: "#/components/parameters/PostId"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - oldest
              - latest
              - most_reacted
            default: oldest
          description: Sort order for returned comments.
        - name: reaction
          in: query
          schema:
            type: string
            enum:
              - all
              - heart
              - thumbs_up
              - fire
              - thumbs_down
            default: all
          description: Reaction type to filter. A specific type requires at least one reaction even when min_reactions is zero.
        - name: min_reactions
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Minimum selected-type count, or total count when reaction=all. Invalid values return 400.
      responses:
        "200":
          description: DAO forum comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommentListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - DAO Forum
      summary: Create a comment on a DAO forum post
      operationId: createDaoForumComment
      description: |
        Uses a Bearer token to authenticate the current user. The user must be a member of the DAO group, the post must exist in that DAO group and not be soft-deleted, and any parent comment must exist on the same post and not be soft-deleted. At least one of body or image_url must be provided after trimming whitespace.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DaoGroupId"
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
            example:
              body: Testing a DAO forum comment
              image_url: null
              parent_comment_id: null
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCommentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/comments/{commentId}:
    options:
      tags:
        - DAO Forum
      summary: CORS preflight for DAO forum comment mutations
      operationId: optionsDaoForumComment
      responses:
        "200":
          description: CORS preflight accepted
    patch:
      tags:
        - DAO Forum
      summary: Update one DAO forum comment
      operationId: updateDaoForumComment
      description: |
        Uses a Bearer token to authenticate the current user. The comment must exist, not be soft-deleted, and be authored by the current user. The parent post must also exist and not be soft-deleted. At least one of body or image_url must be provided; string values are trimmed, empty strings are rejected, and the update cannot leave the comment with neither body nor image_url.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
            example:
              body: Updated DAO forum comment
              image_url: null
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCommentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - DAO Forum
      summary: Soft delete one DAO forum comment
      operationId: deleteDaoForumComment
      description: |
        Uses a Bearer token to authenticate the current user. The comment must exist, not be soft-deleted, and be authored by the current user. The parent post must also exist and not be soft-deleted. The route soft-deletes the comment by setting deleted_at.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Soft-deleted comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteCommentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/comments/{commentId}/reaction/{reactionType}:
    options:
      tags:
        - DAO Forum
      summary: CORS preflight for comment reactions
      operationId: optionsCommentReaction
      responses:
        "200":
          description: CORS preflight accepted
    post:
      tags:
        - DAO Forum
      summary: Add a comment reaction
      operationId: addCommentReaction
      description: Authenticates a Bearer token, rejects deleted comments, and creates the selected reaction for that user. Duplicate user/comment/type returns 409. DAO membership and deleted-parent protection still need database-policy verification and application hardening.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
        - name: reactionType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ReactionType"
      responses:
        "201":
          description: Reaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  reaction:
                    $ref: "#/components/schemas/CommentReaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This user already added the selected reaction type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - DAO Forum
      summary: Remove a comment reaction
      operationId: removeCommentReaction
      description: Removes only the authenticated user's selected reaction. A missing reaction or deleted comment returns 404. DAO membership and deleted-parent protection still need verification.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
        - name: reactionType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ReactionType"
      responses:
        "200":
          description: Reaction removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/dao-forum/{daoGroupId}/posts/{postId}/poll:
    options:
      tags:
        - DAO Forum
      operationId: optionsForumPoll
      summary: CORS preflight for forum polls
      responses:
        "200":
          description: CORS preflight accepted
    get:
      tags:
        - DAO Forum
      operationId: getForumPoll
      summary: Get the post poll and current user selections
      security: *a1
      parameters: &a2
        - $ref: "#/components/parameters/DaoGroupId"
        - $ref: "#/components/parameters/PostId"
      description: Returns {poll:null} when no poll exists. The get_forum_poll RPC authorizes access to the actual post. The route currently does not independently cross-check daoGroupId against that post.
      responses:
        "200":
          description: Poll, or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPollResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - DAO Forum
      operationId: voteForumPoll
      summary: Submit or replace the current user vote
      security: *a1
      parameters: *a2
      description: Replaces existing selections. Single-choice polls require one option; multiple-choice polls allow up to six distinct options from this poll. Database RPCs enforce membership and a live post. This is a forum poll, not an on-chain governance vote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - optionIds
              properties:
                optionIds:
                  type: array
                  minItems: 1
                  maxItems: 6
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Updated poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPollResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
